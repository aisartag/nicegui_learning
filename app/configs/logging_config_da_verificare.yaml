version: 1
disable_existing_loggers: false

# Il tuo "strapuntino" personalizzato
config_extra:
  root_name: "sight"
  filter_by_client: true  
  max_ui_lines: 50

formatters:
  generic:
    format: "%(asctime)s [%(process)d] [%(levelname)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S %z"
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
handlers:
  console:
    (): logging.StreamHandler
    level: DEBUG
    formatter: standard
  file:
    (): logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: generic
    filename: "logs/sight.log" # Puntiamo alla cartella dei volumi definita nel compose
    maxBytes: 1048576
    backupCount: 5

root:
  level: INFO
  handlers: [console, file]

loggers:
  watchfiles.main:
    level: WARNING
  uvicorn:         
    level: WARNING
  # 👇 AGGIUNGI QUESTO BLOCCO PER SQLALCHEMY
  sqlalchemy.engine:
    level: INFO # Verrà sovrascritto dinamicamente da Python
    handlers: [console, file]
    propagate: false

  # 👇 AGGIUNGI QUESTO BLOCCO PER SQLALCHEMY
  sqlalchemy.pool:
    level: INFO # Verrà sovrascritto dinamicamente da Python
    handlers: [console, file]
    propagate: false