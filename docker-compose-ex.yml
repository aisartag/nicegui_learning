services:
  db:
    image: postgres:15
    # ... configurazione db ...
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nicegui_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgresql+asyncpg://user:password@db:5432/nicegui_db
    depends_on:
      db:
        condition: service_healthy # Attende che Postgres sia realmente pronto
